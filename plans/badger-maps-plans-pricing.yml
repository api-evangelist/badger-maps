description: >-
  Badger Maps is sold as a per-user monthly subscription with two core tiers -
  Business and Enterprise - each billed per user, with a discount for annual
  commitment. Both core tiers include API/Developer Key access, capped at 25,000
  requests per day per team; the key must be enabled by contacting Badger Maps
  support. Badger also sells add-on products (Align territory management, Lead
  Routing, Insights, and Scoreboard) that are priced separately per user, per
  rep, or per territory. There is no separate metered charge for API calls
  beyond the daily request cap - API access rides on the seat subscription.
notes: >-
  Prices captured from the public Badger Maps pricing page on 2026-07-04 and may
  change. Annual pricing is the lower per-user monthly figure billed yearly;
  monthly pricing is the higher month-to-month figure. Verify current rates and
  add-on minimums on the pricing page during reconciliation.
