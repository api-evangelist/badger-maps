principles:
- name: Visibility
  description: Track active seat count per plan and per add-on; monitor daily API request volume against the 25k/day/team cap.
- name: Allocation
  description: Map seats and add-on subscriptions to teams/territories so subscription cost lands on the right cost center.
- name: Optimization
  description: Right-size seat count to active reps, choose annual billing for the lower per-user rate, and adopt add-ons only where they earn their keep; consolidate integrations to stay inside the included daily API quota.
- name: Accountability
  description: Assign an owner per team subscription and review seat/add-on counts each renewal against actual field-rep headcount.
