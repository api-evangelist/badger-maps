responseCodes:
  throttled: 429
  published: false
  note: >-
    429 is the conventional REST value and is MODELED, not published. Badger Maps
    documents no status code for quota exhaustion. Verify against a live enabled
    key before relying on it.
headers:
  published: false
  ratelimit_limit: null
  ratelimit_remaining: null
  ratelimit_reset: null
  retry_after: null
  note: >-
    No X-RateLimit-* or RFC 9238 RateLimit-* response headers are documented, and
    no Retry-After contract. An agent cannot see how much of the shared
    25,000/day team quota is left, which is the practical limitation here: the
    number is public but the runtime signal is not. Confirmed absent from the
    provider's published API Blueprint on 2026-08-13.
limit_count: 3
limits:
- name: Daily API Requests
  scope: team
  metric: requests
  limit: 25000
  timeFrame: day
  notes: Maximum 25,000 API requests per day, shared across the team. Stated on the pricing page.
- name: Burst / Per-Second Rate
  scope: account
  metric: requests
  limit: not published
  notes: No documented per-second or per-minute burst limit in the public API Blueprint (modeled as unspecified).
- name: API Key Enablement
  scope: account
  metric: access
  limit: gated
  notes: The API/Developer Key must be enabled by Badger Maps support before requests are accepted.
policies:
- name: Daily Quota Reset
  description: The 25k request allowance is a per-day cap per team; plan integrations to stay within the daily budget.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After on any 429 responses (modeled - verify headers with an enabled key).
- name: Token Authentication
  description: All requests must carry an Authorization Token header; unauthenticated or unenabled keys are rejected.
