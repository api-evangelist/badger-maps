  - Customers
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://badgerupdatedapi.docs.apiary.io/
  baseURL: https://badgerapis.badgermapping.com/api/2
  properties:
