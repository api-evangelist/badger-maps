description: >-
  FinOps view of Badger Maps spend. Badger Maps is a per-user SaaS subscription:
  cost is driven primarily by the number of seats on the Business or Enterprise
  plan (billed monthly or annually per user), plus any add-on products (Align,
  Lead Routing, Insights, Scoreboard) which are billed separately per user, per
  rep, or per territory. API/Developer Key access is included in the seat price
  with no separate per-call charge; the only API-side constraint is a
  25,000-request-per-day-per-team quota, so API cost is effectively fixed within
  the subscription rather than usage-metered. The dominant lever for spend is
  seat count and add-on adoption, not API traffic.
notes: >-
  Per-user rates captured 2026-07-04 from the public pricing page and not
  reconciled against a signed order form. Annual commitments lower the effective
  per-user monthly rate; add-ons carry seat/territory minimums with volume
  discounts. Verify current pricing during reconciliation.
