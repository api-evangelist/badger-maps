description: >-
  Badger Maps publishes one headline API quota: API/Developer Key access allows
  a maximum of 25,000 requests per day, per team. This is a daily volume cap
  shared across all users on a team's account rather than a documented
  per-user or per-second burst limit. The API/Developer Key must be enabled by
  contacting Badger Maps support before it will accept requests. Finer-grained
  per-second/per-minute throttles or a documented 429 back-off contract are not
  published in the public API Blueprint and would need to be confirmed against
  live response headers with an enabled key.
notes: >-
  The 25k/day/team figure is stated on the Badger Maps pricing/features pages.
  Per-second burst behavior and any Retry-After semantics are modeled as
  standard REST practice and should be verified with an enabled key during
  reconciliation.
