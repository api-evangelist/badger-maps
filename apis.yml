aid: badger-maps
url: https://raw.githubusercontent.com/api-evangelist/badger-maps/refs/heads/main/apis.yml
name: Badger Maps
kind: company
description: Badger Maps is field sales route planning, mapping, and CRM software for
  outside sales and field teams - it optimizes daily driving routes, maps and filters
  accounts on a territory, captures check-ins, and reports on rep activity. Badger
  Maps also exposes a token-authenticated REST API (base
  https://badgerapis.badgermapping.com/api/2) that lets teams programmatically manage
  accounts (customers), account locations, routes, check-ins, and users, and sync
  data with CRMs and other systems. API/Developer Key access is included with paid
  plans (max 25k requests per day, per team); the key must be enabled by contacting
  Badger Maps support.
