    type: APIReference
  - url: openapi/badger-maps-openapi.yml
    type: OpenAPI
  - url: collections/badger-maps.postman_collection.json
    type: PostmanCollection
  - url: collections/badger-maps.opencollection.json
    type: OpenCollection
  description: List, create, retrieve, update, and delete accounts (called customers
    in the API) - the businesses and contacts a rep maps and visits. Accounts carry
    name, address, contact details, geocoded location(s), an account owner, and
    custom data fields, and are the primary object synced with CRMs.
- aid: badger-maps:badger-maps-locations-api
  name: Badger Maps Locations API
  tags:
  - Locations
  - Geocoding
  - Addresses
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://badgerupdatedapi.docs.apiary.io/
  baseURL: https://badgerapis.badgermapping.com/api/2
  properties:
  - url: https://badgerupdatedapi.docs.apiary.io/#reference/locations
    type: APIReference
  - url: openapi/badger-maps-openapi.yml
    type: OpenAPI
  - url: collections/badger-maps.postman_collection.json
    type: PostmanCollection
  - url: collections/badger-maps.opencollection.json
    type: OpenCollection
  description: Update the physical locations attached to an account - an account can
    have one or more addresses that Badger geocodes to latitude/longitude for mapping
    and routing. Correcting an address or supplying explicit coordinates re-pins the
    account on the map.
- aid: badger-maps:badger-maps-check-ins-api
  name: Badger Maps Check-Ins API
  tags:
  - Check-Ins
  - Appointments
  - Activity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://badgerupdatedapi.docs.apiary.io/
  baseURL: https://badgerapis.badgermapping.com/api/2
  properties:
  - url: https://badgerupdatedapi.docs.apiary.io/#reference/check-ins
    type: APIReference
  - url: openapi/badger-maps-openapi.yml
    type: OpenAPI
  - url: collections/badger-maps.postman_collection.json
    type: PostmanCollection
  - url: collections/badger-maps.opencollection.json
    type: OpenCollection
  description: List and create check-ins (served under the /appointments/ resource) -
    the timestamped logs a rep records against an account after a visit or call,
    carrying a type, free-text comments, the author, and a log datetime. Check-ins
    are the activity feed that powers reporting and CRM sync.
- aid: badger-maps:badger-maps-routes-api
  name: Badger Maps Routes API
  tags:
  - Routes
  - Route Optimization
  - Waypoints
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://badgerupdatedapi.docs.apiary.io/
  baseURL: https://badgerapis.badgermapping.com/api/2
  properties:
  - url: https://badgerupdatedapi.docs.apiary.io/#reference/routes
    type: APIReference
  - url: openapi/badger-maps-openapi.yml
    type: OpenAPI
  - url: collections/badger-maps.postman_collection.json
    type: PostmanCollection
  - url: collections/badger-maps.opencollection.json
    type: OpenCollection
  description: List a rep's optimized routes and retrieve a single route with its
    ordered waypoints - each waypoint references an account location, its position in
    the sequence, and timing details. Routes are the optimized driving plans Badger
    generates across a set of accounts.
- aid: badger-maps:badger-maps-users-api
  name: Badger Maps Users API
  tags:
  - Users
  - Profiles
