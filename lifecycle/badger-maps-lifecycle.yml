description: >-
  Versioning, deprecation and operational-transparency posture for the Badger
  Maps API. Badger publishes a one-paragraph versioning statement in its API
  Blueprint and runs a live status page, but publishes no deprecation policy, no
  sunset/deprecation header contract, no SLA and no API changelog.
versioning:
  scheme: uri-path
  current: v2
  base: https://badgerapis.badgermapping.com/api/2
  policy_text: >-
    "The current version of the API is v2. Other versions may be made available
    as backwards incompatible changes are introduced."
  docs: https://badgerupdatedapi.docs.apiary.io/#introduction/versioning
  note: >-
    The statement establishes that breaking changes get a new path version, but
    names no notice period, no support window for v1, and no migration guide.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
