    type: OpenAPI
  - url: collections/badger-maps.postman_collection.json
    type: PostmanCollection
  - url: collections/badger-maps.opencollection.json
    type: OpenCollection
  description: Authenticate a user to obtain an API token, retrieve the authenticated
    user profile (company, settings, and the custom data-field schema), and search
    for managed users by email or ID. User IDs are required to own accounts and
    scope routes and check-ins across a managed team.
