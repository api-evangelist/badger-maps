gaps:
- No RFC 9457 application/problem+json anywhere.
- No documented 429 body or Retry-After behaviour despite a published 25k/day/team quota.
- No error code registry for non-login operations.
- Login collapses "unknown user" and "wrong password" into one status, which is good for
  enumeration resistance but means a client cannot distinguish provisioning failure from a typo.
